stages: [build, deploy]

variables:
  # CI variables: NEXUS_REGISTRY, NEXUS_USER, NEXUS_PASSWORD,
  # KUBE_CONFIG (GitLab File or raw YAML), K8S_NAMESPACE, K8S_APP_DOMAIN
  GIT_STRATEGY: clone

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      set -eu
      : "${NEXUS_REGISTRY:?missing}" "${NEXUS_USER:?missing}" "${NEXUS_PASSWORD:?missing}"
      mkdir -p /kaniko/.docker
      AUTH=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$NEXUS_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
      chmod 600 /kaniko/.docker/config.json
      if [ -n "${REGISTRY_CA_PEM:-}" ]; then
        printf '%s\n' "$REGISTRY_CA_PEM" >> /kaniko/ssl/certs/ca-certificates.crt
      fi
    - /kaniko/executor --context "$CI_PROJECT_DIR/app" --dockerfile "$CI_PROJECT_DIR/app/Dockerfile" --destination "$NEXUS_REGISTRY/docker-hosted/office-wallet-app:$CI_COMMIT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR/mock" --dockerfile "$CI_PROJECT_DIR/mock/Dockerfile" --destination "$NEXUS_REGISTRY/docker-hosted/office-wallet-mock:$CI_COMMIT_SHA"

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  before_script:
    - apk add --no-cache helm kubectl ca-certificates openssl
  script:
    - |
      set -eu
      : "${K8S_NAMESPACE:?missing}" "${K8S_APP_DOMAIN:?missing}"
      : "${NEXUS_REGISTRY:?missing}" "${NEXUS_USER:?missing}" "${NEXUS_PASSWORD:?missing}"
      case "$K8S_NAMESPACE" in team-[0-9]*-app) ;; *) echo "Invalid namespace" >&2; exit 1;; esac
      expected="${K8S_NAMESPACE}.devsecops-contest.ru"
      [ "$K8S_APP_DOMAIN" = "$expected" ] || { echo "Domain must equal $expected" >&2; exit 1; }
      mkdir -p "$CI_PROJECT_DIR/.kube"
      export KUBECONFIG="$CI_PROJECT_DIR/.kube/config"
      if [ -n "${KUBE_CONFIG:-}" ]; then
        if [ -f "$KUBE_CONFIG" ]; then cp "$KUBE_CONFIG" "$KUBECONFIG"; else printf '%s\n' "$KUBE_CONFIG" > "$KUBECONFIG"; fi
      else
        : "${K8S_DEPLOY_TOKEN:?missing}" "${K8S_API_URL:?missing}"
        kubectl config set-cluster target --server="$K8S_API_URL" --kubeconfig="$KUBECONFIG"
        kubectl config set-credentials deploy --token="$K8S_DEPLOY_TOKEN" --kubeconfig="$KUBECONFIG"
        kubectl config set-context target --cluster=target --user=deploy --namespace="$K8S_NAMESPACE" --kubeconfig="$KUBECONFIG"
        kubectl config use-context target --kubeconfig="$KUBECONFIG"
      fi
      chmod 600 "$KUBECONFIG"
      if [ -z "${KUBE_CONFIG:-}" ] && [ -n "${K8S_CA_PEM:-}" ]; then
        printf '%s\n' "$K8S_CA_PEM" > "$CI_PROJECT_DIR/.kube/ca.crt"
        kubectl config set-cluster target --certificate-authority="$CI_PROJECT_DIR/.kube/ca.crt" --embed-certs=true --kubeconfig="$KUBECONFIG"
      fi
      # RECREATE=true: uninstall release and delete only this application's PVCs.
      sh "$CI_PROJECT_DIR/ci/recreate.sh"
      # Generate application-only credentials, reusing values from the live Secret on normal upgrades.
      . "$CI_PROJECT_DIR/ci/app-credentials.sh"
      # imagePullSecret in target namespace. CI SA must allow secrets create/update.
      mkdir -p "$CI_PROJECT_DIR/.docker"
      AUTH=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$NEXUS_REGISTRY" "$AUTH" > "$CI_PROJECT_DIR/.docker/config.json"
      kubectl -n "$K8S_NAMESPACE" create secret generic registry-creds --type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson="$CI_PROJECT_DIR/.docker/config.json" --dry-run=client -o yaml | kubectl -n "$K8S_NAMESPACE" apply -f -
      rm -f "$CI_PROJECT_DIR/.docker/config.json"
      # TLS Secret is provisioned once by the cluster admin (not by the namespace-scoped CI SA).
      # This preflight prevents silently deploying HTTP or an Ingress with a missing certificate.
      export TLS_SECRET_NAME="${TLS_SECRET_NAME:-contest-tls}"
      tls_type="$(kubectl -n "$K8S_NAMESPACE" get secret "$TLS_SECRET_NAME" -o jsonpath='{.type}' 2>/dev/null)" || {
        echo "Missing TLS Secret $TLS_SECRET_NAME in namespace $K8S_NAMESPACE. Ask cluster admin to run admin/copy-contest-tls.sh" >&2
        exit 1
      }
      [ "$tls_type" = 'kubernetes.io/tls' ] || { echo "Secret $TLS_SECRET_NAME has type $tls_type, expected kubernetes.io/tls" >&2; exit 1; }
      echo "TLS Secret $TLS_SECRET_NAME found in namespace $K8S_NAMESPACE"
      K8S_SECONDARY_DOMAIN="${K8S_NAMESPACE}-secondary.devsecops-contest.ru"
      # Keep --namespace fixed; no namespace creation / ClusterRole needed.
      set -- helm upgrade --install "office-wallet" "./charts/office-wallet" --namespace "$K8S_NAMESPACE" --wait --timeout 10m
      set -- "$@" --set-string image.app.repository="$NEXUS_REGISTRY/docker-hosted/office-wallet-app" --set-string image.app.tag="$CI_COMMIT_SHA" --set-string image.mock.repository="$NEXUS_REGISTRY/docker-hosted/office-wallet-mock" --set-string image.mock.tag="$CI_COMMIT_SHA" --set-string postgres.password="$DB_PASSWORD" --set-string app.sessionKey="$APP_SESSION_KEY" --set-string app.paymentKey="$APP_PAYMENT_KEY"
      # Основной Ingress
      set -- "$@" \
        --set-string 'ingress.hosts[0].host'="$K8S_APP_DOMAIN" \
        --set-string 'ingress.hosts[0].paths[0].path'=/ \
        --set-string 'ingress.hosts[0].paths[0].pathType'=Prefix \
        --set-string ingress.className=nginx \
        --set-string 'ingress.tls[0].secretName'="$TLS_SECRET_NAME" \
        --set-string 'ingress.tls[0].hosts[0]'="$K8S_APP_DOMAIN"

      # Дополнительный Ingress для Mailpit
      set -- "$@" \
        --set mailIngress.enabled=true \
        --set-string mailIngress.className=nginx \
        --set-string 'mailIngress.hosts[0].host'="$K8S_SECONDARY_DOMAIN" \
        --set-string 'mailIngress.hosts[0].paths[0].path'=/ \
        --set-string 'mailIngress.hosts[0].paths[0].pathType'=Prefix \
        --set-string 'mailIngress.tls[0].secretName'="$TLS_SECRET_NAME" \
        --set-string 'mailIngress.tls[0].hosts[0]'="$K8S_SECONDARY_DOMAIN"

      # Адреса приложения
      set -- "$@" \
        --set-string app.publicBase="https://$K8S_APP_DOMAIN" \
        --set-string app.mailUi="https://$K8S_SECONDARY_DOMAIN"
      "$@"
      kubectl -n "$K8S_NAMESPACE" get pods,svc,ingress
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
