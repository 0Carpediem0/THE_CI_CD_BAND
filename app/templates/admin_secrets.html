{{template "head" .}}
{{template "top" .}}
<main>
  {{template "flash" .}}
  <section class="panel">
    <h1>Служебный контур</h1>
    <p class="muted">Журнал служебных событий</p>
    <table class="table">
      <thead><tr><th>Тип</th><th>Деталь</th><th>Когда</th></tr></thead>
      <tbody>
      {{range .Data.Logs}}
        <tr><td>{{.Kind}}</td><td class="mono">{{.Detail}}</td><td class="muted">{{.Created}}</td></tr>
      {{else}}
        <tr><td colspan="3" class="muted">Записей нет</td></tr>
      {{end}}
      </tbody>
    </table>
  </section>
</main>
{{template "foot" .}}
