{{template "head" .}}
<div class="auth-shell">
  <form class="auth-card" method="post" action="/login">
    <div class="brand-line">
      <span class="logo-mark"></span>
      <span>Office Wallet</span>
    </div>
    <h1 style="margin:0 0 8px;letter-spacing:-0.03em">Вход</h1>
    <p class="muted" style="margin:0 0 18px">Цифровой кошелёк офисного контура</p>
    {{if .Flash}}<div class="flash bad">{{.Flash}}</div>{{end}}
    <span id="auth-state">{{if .Flash}}{{.Flash}}{{end}}</span>
    <label>Логин</label>
    <input name="login" value="{{index .Data "Login"}}" autocomplete="username" required>
    <label>Пароль</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <input type="hidden" name="return" value="{{index .Data "Return"}}">
    <button class="btn" type="submit" style="width:100%;justify-content:center">Войти</button>
    <p class="muted" style="margin:16px 0 0;font-size:0.9rem">
      <a href="/register">Регистрация</a> ·
      <a href="/password/forgot">Сброс пароля</a>
    </p>
  </form>
</div>
{{template "foot" .}}
