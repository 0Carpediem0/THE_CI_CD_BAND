{{template "head" .}}
{{template "top" .}}
<main>
  {{template "flash" .}}
  <section class="panel">
    <h1>Уведомления о платеже</h1>
    <p class="muted">URL callback для сервиса уведомлений.</p>
    {{if index .Data "Error"}}<div class="flash bad">{{index .Data "Error"}}</div>{{end}}
    {{if index .Data "Fetched"}}<pre class="receipt-preview">{{index .Data "Fetched"}}</pre>{{end}}
    <form method="post" action="/settings/notify">
      <label>Callback URL</label>
      <input name="notify_url" value="{{index .Data "NotifyURL"}}" placeholder="http://…">
      <button class="btn" type="submit">Сохранить и проверить</button>
    </form>
  </section>
</main>
{{template "foot" .}}
