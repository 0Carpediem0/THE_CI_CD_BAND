{{template "head" .}}
<div class="auth-shell">
  <form class="auth-card" method="post" action="/password/forgot">
    {{template "csrf" .}}
    <div class="brand-line"><span class="logo-mark"></span><span>Office Wallet</span></div>
    <h1 style="margin:0 0 14px">Сброс пароля</h1>
    {{template "flash" .}}
    <label>Логин</label>
    <input name="login" required>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Отправить ссылку</button>
    <p class="muted" style="margin-top:14px"><a href="/login">Ко входу</a></p>
  </form>
</div>
{{template "foot" .}}
