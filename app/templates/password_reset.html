{{template "head" .}}
<div class="auth-shell">
  <form class="auth-card" method="post" action="/password/reset">
    {{template "csrf" .}}
    <div class="brand-line"><span class="logo-mark"></span><span>Office Wallet</span></div>
    <h1 style="margin:0 0 14px">Новый пароль</h1>
    <p class="muted">Нужны номер заявки из письма и код из SMS.</p>
    {{if .Flash}}<div class="flash bad">{{.Flash}}</div>{{end}}
    <label>Номер заявки (rid)</label>
    <input name="rid" value="{{index .Data "RID"}}" required>
    <label>Код из SMS</label>
    <input name="sms_code" inputmode="numeric" autocomplete="one-time-code" required>
    <label>Новый пароль</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Сохранить</button>
  </form>
</div>
{{template "foot" .}}
