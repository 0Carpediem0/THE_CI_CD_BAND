{{template "head" .}}
<div class="auth-shell">
  <form class="auth-card" method="post" action="/register">
    <div class="brand-line"><span class="logo-mark"></span><span>Office Wallet</span></div>
    <h1 style="margin:0 0 14px">Регистрация</h1>
    {{if .Flash}}<div class="flash bad">{{.Flash}}</div>{{end}}
    <label>Логин</label><input name="login" required>
    <label>Имя</label><input name="display_name" required>
    <label>Email</label><input name="email" type="email" required>
    <label>Пароль</label><input name="password" type="password" required>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Создать</button>
    <p class="muted" style="margin-top:14px"><a href="/login">Ко входу</a></p>
  </form>
</div>
{{template "foot" .}}
