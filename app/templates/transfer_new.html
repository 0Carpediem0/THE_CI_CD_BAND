{{template "head" .}}
{{template "top" .}}
<main>
  {{template "flash" .}}
  <div class="grid-2">
    <section class="panel">
      <h1>Перевод</h1>
      <form method="post" action="/transfer/new" enctype="multipart/form-data">
      {{template "csrf" .}}
        <label>Получатель (логин)</label>
        <input name="recipient" required>
        <label>Сумма, ₽</label>
        <input name="amount_rub" placeholder="10,00" required>
        <label>Комментарий</label>
        <input name="memo">
        <button class="btn" type="submit">Далее</button>
      </form>
    </section>
    <section class="panel">
      <h2>Получатель</h2>
      <p class="muted">Укажите логин целиком. Справочник сотрудников не выводится.</p>
    </section>
  </div>
</main>
{{template "foot" .}}
