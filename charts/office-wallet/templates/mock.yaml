apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "office-wallet.fullname" . }}-mock
  labels:
    {{- include "office-wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: notify-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "office-wallet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notify-mock
  template:
    metadata:
      labels:
        {{- include "office-wallet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notify-mock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mock
          image: "{{ .Values.image.mock.repository }}:{{ .Values.image.mock.tag }}"
          imagePullPolicy: {{ .Values.image.mock.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            {{- toYaml .Values.resources.mock | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "office-wallet.fullname" . }}-mock
  labels:
    {{- include "office-wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: notify-mock
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "office-wallet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notify-mock
