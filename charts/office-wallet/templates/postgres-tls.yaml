{{- if ne .Values.postgres.sslmode "disable" }}
{{- $full := include "office-wallet.fullname" . }}
{{- $secretName := printf "%s-pg-tls" $full }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if and $old $old.data (index $old.data "ca.crt") (index $old.data "tls.crt") (index $old.data "tls.key") }}
{{- $caCert = index $old.data "ca.crt" }}
{{- $tlsCert = index $old.data "tls.crt" }}
{{- $tlsKey = index $old.data "tls.key" }}
{{- else }}
{{- $cn := printf "%s-postgres" $full }}
{{- $ca := genCA (printf "%s-ca" $cn) 3650 }}
{{- $dns := list $cn (printf "%s.%s" $cn .Release.Namespace) (printf "%s.%s.svc" $cn .Release.Namespace) (printf "%s.%s.svc.cluster.local" $cn .Release.Namespace) }}
{{- $cert := genSignedCert $cn (list "127.0.0.1") $dns 3650 $ca }}
{{- $caCert = $ca.Cert | b64enc }}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "office-wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  ca.crt: {{ $caCert }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
{{- end }}
