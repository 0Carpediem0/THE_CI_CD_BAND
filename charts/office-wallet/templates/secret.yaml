apiVersion: v1
kind: Secret
metadata:
  name: {{ include "office-wallet.fullname" . }}-db
  labels:
    {{- include "office-wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- $dsn := printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=%s" .Values.postgres.username .Values.postgres.password (include "office-wallet.fullname" .) .Values.postgres.database .Values.postgres.sslmode }}
  {{- if ne .Values.postgres.sslmode "disable" }}
  {{- $dsn = printf "%s&sslrootcert=/etc/pg-ca/ca.crt" $dsn }}
  {{- end }}
  DATABASE_URL: {{ $dsn | quote }}
  SESSION_KEY: {{ .Values.app.sessionKey | quote }}
  PAYMENT_KEY: {{ .Values.app.paymentKey | quote }}
  MAIL_UI_PASSWORD: {{ .Values.mail.uiPassword | quote }}
