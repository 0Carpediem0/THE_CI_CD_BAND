nameOverride: ""
fullnameOverride: "office-wallet"

image:
  app:
    repository: office-wallet-app
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  mock:
    repository: office-wallet-mock
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  postgres: postgres:16-alpine
  mailpit: axllent/mailpit:latest

imagePullSecrets:
  - name: registry-creds

service:
  app:
    type: ClusterIP
    port: 8080
  mail:
    type: ClusterIP
    uiPort: 8025
    smtpPort: 1025

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.org/redirect-to-https: "true"
  hosts:
    - host: office-wallet.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Mailpit is a separate Deployment (not bundled into the app image).
# Set mail.enabled=false to use an external SMTP/UI and set app.mailHost / app.mailUi.
mail:
  enabled: true
  uiUser: mail
  uiPassword: "" # generated by ci/app-credentials.sh

mailIngress:
  enabled: true
  className: nginx
  annotations:
    nginx.org/redirect-to-https: "true"
  hosts:
    - host: office-wallet-mail.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgres:
  database: wallet
  username: wallet
  password: "" # generated by ci/app-credentials.sh
  sslmode: verify-full
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path

app:
  publicBase: "http://office-wallet.local"
  mailHost: ""
  mailPort: "1025"
  mailUi: "http://office-wallet-mail.local"
  devInsecure: "0"
  sessionKey: "" # generated by ci/app-credentials.sh
  paymentKey: "" # generated by ci/app-credentials.sh
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path

resources:
  app:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  db:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  mock:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  mail:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# CI sets this to team-<n>-app.devsecops-contest.ru and optional TLS
