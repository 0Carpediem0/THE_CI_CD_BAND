server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /hooks/verify {
        return 302 /service/status;
    }
    location = /hooks/verify/ {
        return 302 /service/status;
    }
    location = /service/status {
        try_files /service/status/index.html =404;
    }
    location = /service/status/ {
        try_files /service/status/index.html =404;
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
